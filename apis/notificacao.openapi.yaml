openapi: 3.0.3
info:
  title: Serviço Notificação — MCEcelulares
  version: "1.0.0"
  description: Envio de e-mails transacionais (assina eventos) e formulário de contato.
servers:
  - url: /notificacao
paths:
  /contato:
    post:
      summary: Recebe mensagem do formulário de contato e envia direto por e-mail (não persiste)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, mensagem]
              properties:
                nome: { type: string }
                assunto: { type: string }
                telefone: { type: string }
                email: { type: string }
                mensagem: { type: string }
      responses:
        "202": { description: Mensagem recebida e enviada por e-mail }
  /logs/{idPedido}:
    get:
      summary: Consulta o histórico de notificações enviadas para um pedido (debug/suporte)
      parameters:
        - in: path
          name: idPedido
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Lista de notificações enviadas (notificacao_log) }
# Este serviço não expõe endpoints de escrita para os eventos —
# eles chegam via Redis Pub/Sub (canais pedido.criado e pagamento.confirmado),
# não via HTTP.

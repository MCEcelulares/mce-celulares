openapi: 3.0.3
info:
  title: Serviço Catálogo — MCEcelulares
  version: "1.4.0"
  description: >-
    Produtos, categorias, marcas, busca e filtros. A leitura é pública; criar e
    editar exige a permissão "catalogo:gerenciar" (RBAC do Identidade, ADR-006).
    O detalhe do produto usa cache-aside no Redis (chave produto:{id}) e é
    invalidado em qualquer alteração. Há limite de requisições por IP (429). Produtos inativos não aparecem na leitura
    pública; "excluir" é inativar (PATCH ativo=false).
  license:
    name: UNLICENSED
servers:
  - url: /catalogo
security:
  - bearerAuth: []
tags:
  - name: Produtos
    description: Consulta pública e gestão de produtos
  - name: Categorias
    description: Categorias de produtos
  - name: Marcas
    description: Marcas de produtos
  - name: Painel
    description: Métricas para o painel administrativo (permissão dashboard:ver)
  - name: Interno
    description: Rotas chamadas só por outros serviços (token de serviço)
  - name: Operação
    description: Health checks e métricas

paths:
  /produtos:
    get:
      tags: [Produtos]
      operationId: listarProdutos
      summary: Lista produtos ativos com filtros, ordenação e paginação
      description: A busca por nome usa LIKE (contém o texto, sem diferenciar maiúsculas).
      security: []
      parameters:
        - in: query
          name: categoria
          schema: { type: integer, minimum: 1 }
        - in: query
          name: marca
          schema: { type: integer, minimum: 1 }
        - in: query
          name: precoMin
          schema: { type: number, minimum: 0 }
        - in: query
          name: precoMax
          schema: { type: number, minimum: 0 }
          description: Não pode ser menor que precoMin (400)
        - in: query
          name: busca
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: Texto contido no nome do produto
        - in: query
          name: disponivel
          schema: { type: boolean }
          description: "true = só produtos com estoque maior que zero"
        - in: query
          name: incluirInativos
          schema: { type: boolean, default: false }
          description: >-
            "true" inclui itens inativos e exige token com "catalogo:gerenciar" (visão do painel).
        - in: query
          name: ordenar
          schema: { type: string, enum: [recentes, preco_asc, preco_desc], default: recentes }
        - in: query
          name: pagina
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limite
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Página de produtos
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items: { $ref: "#/components/schemas/Produto" }
                  pagina: { type: integer }
                  limite: { type: integer }
                  total: { type: integer, description: Total de produtos que atendem aos filtros }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
    post:
      tags: [Produtos]
      operationId: criarProduto
      summary: Cadastra um produto
      description: Exige a permissão "catalogo:gerenciar". A imagem é informada como URL/caminho (não há upload neste serviço).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProdutoEntrada" }
      responses:
        "201":
          description: Produto criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Produto" }
        "400":
          description: Dados inválidos ou marca/categoria inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /produtos/resumo:
    get:
      tags: [Painel]
      operationId: resumoDoCatalogo
      summary: Contagens do catálogo para o painel (RF46)
      description: Exige "dashboard:ver". Usuários e pedidos saem dos serviços donos desses dados (ADR-012).
      responses:
        "200":
          description: Resumo
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_produtos: { type: integer }
                  produtos_ativos: { type: integer }
                  produtos_inativos: { type: integer }
                  produtos_sem_estoque: { type: integer, description: Ativos com estoque zero }
                  produtos_em_destaque: { type: integer }
                  valor_em_estoque: { type: number, description: Soma de preço x estoque dos produtos ativos }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403":
          description: Sem a permissão dashboard:ver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /produtos/destaque:
    get:
      tags: [Produtos]
      operationId: listarProdutosDestaque
      summary: Produtos em destaque (para o carrossel da home)
      security: []
      parameters:
        - in: query
          name: limite
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Produtos ativos com destaque=true, do mais novo para o mais antigo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Produto" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }

  /produtos/recentes:
    get:
      tags: [Produtos]
      operationId: listarProdutosRecentes
      summary: Produtos adicionados recentemente (ordenado por criado_em)
      security: []
      parameters:
        - in: query
          name: limite
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Produtos ativos mais recentes primeiro
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Produto" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }

  /produtos/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Produtos]
      operationId: buscarProdutoPorId
      summary: Detalhe de um produto ativo (cache-aside via Redis)
      description: Com incluirInativos=true (e permissão) mostra também produto inativo, sem passar pelo cache.
      security: []
      parameters:
        - in: query
          name: incluirInativos
          schema: { type: boolean, default: false }
          description: "true exige token com catalogo:gerenciar"
      responses:
        "200":
          description: Produto encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Produto" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "404":
          description: Produto não existe ou está inativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    patch:
      tags: [Produtos]
      operationId: atualizarProduto
      summary: Atualiza produto (invalida o cache no Redis)
      description: >-
        Exige a permissão "catalogo:gerenciar". Aceita qualquer subconjunto dos
        campos. Para excluir, envie ativo=false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProdutoAtualizacao" }
      responses:
        "200":
          description: Produto atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Produto" }
        "400":
          description: Dados inválidos ou marca/categoria inexistente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Produto não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

    delete:
      tags: [Produtos]
      operationId: inativarProduto
      summary: Exclui (inativa) o produto
      description: >-
        Exige "catalogo:gerenciar". Exclusão lógica: o produto passa a ativo=false e some da leitura
        pública (equivale a PATCH ativo=false). Repetir a chamada em produto já inativo também responde 204.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Produto inativado
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Produto não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /produtos/{id}/imagem:
    post:
      tags: [Produtos]
      operationId: enviarImagemDoProduto
      summary: Envia a imagem do produto (RF15, RNF07)
      description: >-
        Exige "catalogo:gerenciar" (checado antes de aceitar o arquivo). multipart/form-data
        com o arquivo no campo "imagem". Aceita JPEG, PNG e WEBP de até 2 MB; o tipo é
        conferido pelos bytes do arquivo, não pelo que o cliente declara. O nome do
        arquivo é gerado pelo servidor. Substitui (e apaga) a imagem anterior enviada por
        aqui. O arquivo é servido em GET {imagem} (ex.: /catalogo/imagens/{uuid}.png), com
        cache longo.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem: { type: string, format: binary }
      responses:
        "200":
          description: Imagem salva
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_produto: { type: integer }
                  imagem: { type: string, example: /catalogo/imagens/0b7a3c3e-1111-4222-8333-444455556666.png }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Produto não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "413":
          description: Imagem maior que 2 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "415":
          description: Tipo não aceito, ou o conteúdo não é uma imagem JPEG, PNG ou WEBP válida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "429":
          description: Muitos envios a partir deste IP
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

    put:
      tags: [Produtos]
      operationId: substituirImagemDoProduto
      summary: Envia a imagem do produto (mesmo comportamento do POST)
      description: Equivalente ao POST desta rota; enviar o arquivo substitui a imagem atual.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem: { type: string, format: binary }
      responses:
        "200":
          description: Imagem salva
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_produto: { type: integer }
                  imagem: { type: string, example: /catalogo/imagens/0b7a3c3e-1111-4222-8333-444455556666.png }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Produto não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "413":
          description: Imagem maior que 2 MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "415":
          description: Tipo não aceito, ou o conteúdo não é uma imagem JPEG, PNG ou WEBP válida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    delete:
      tags: [Produtos]
      operationId: removerImagemDoProduto
      summary: Remove a imagem do produto
      description: Exige "catalogo:gerenciar". Apaga o arquivo do disco. Responde 204 também se o produto já não tinha imagem.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Imagem removida
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Produto não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /produtos/{id}/estoque:
    patch:
      tags: [Produtos]
      operationId: ajustarEstoque
      summary: Ajuste manual de estoque pelo painel (soma ou subtrai)
      description: Exige a permissão "catalogo:gerenciar". O estoque nunca fica negativo (409).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ajuste]
              properties:
                ajuste: { type: integer, description: "Positivo soma, negativo subtrai" }
      responses:
        "200":
          description: Estoque ajustado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Produto" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Produto não encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "409":
          description: O ajuste deixaria o estoque negativo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /produtos/{id}/estoque/reposicao:
    post:
      tags: [Interno]
      operationId: reporEstoque
      summary: Soma ao estoque (token de serviço) — rota avulsa, o Vendas usa /interno/reservas
      description: >-
        Autenticada pelo token de serviço (SERVICE_TOKEN, enviado como Bearer) e, ao contrário de /interno/*,
        NÃO é bloqueada no gateway. Soma a quantidade ao estoque, inclusive de produto inativo. O Vendas não a usa
        mais: a devolução de pedidos cancelados é feita por pedido em /interno/reservas/{idPedido}/devolucao (ADR-009).
      security:
        - serviceToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantidade]
              properties:
                quantidade: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Estoque somado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id_produto: { type: integer }
                  estoque: { type: integer, description: Saldo depois da reposição }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401":
          description: Token de serviço ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "404":
          description: Produto não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /interno/produtos:
    get:
      tags: [Interno]
      operationId: internoProdutos
      summary: Dados de vários produtos por id (chamada pelo Vendas)
      description: >-
        Rota interna: autenticada pelo token de serviço (SERVICE_TOKEN, enviado
        como Bearer) e bloqueada no gateway (/catalogo/interno/ responde 404).
        Sem SERVICE_TOKEN configurado as rotas /interno respondem 503.
      security:
        - serviceToken: []
      parameters:
        - in: query
          name: ids
          required: true
          schema: { type: string, example: "1,2,3" }
      responses:
        "200":
          description: Produtos encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProdutoInterno" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401":
          description: Token de serviço ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /interno/reservas:
    post:
      tags: [Interno]
      operationId: reservarEstoque
      summary: Reserva o estoque de um pedido (tudo ou nada, idempotente por pedido)
      description: >-
        Rota interna (token de serviço, bloqueada no gateway). Reserva todos os
        itens numa transação: se um não tiver estoque, nenhum é reservado.
        Repetir a chamada para o mesmo pedido com os mesmos itens não baixa de
        novo (200); por isso o Vendas pode repetir em caso de falha de rede.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_pedido, itens]
              properties:
                id_pedido: { type: integer, minimum: 1 }
                itens:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id_produto, quantidade]
                    properties:
                      id_produto: { type: integer, minimum: 1 }
                      quantidade: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Reserva já existia para este pedido (repetição idempotente)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservaEstoque" }
        "201":
          description: Reserva criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservaEstoque" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401":
          description: Token de serviço ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "404":
          description: Algum produto não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "409":
          description: >-
            Estoque insuficiente (com "detalhes": lista das faltas), produto
            inativo, reserva já devolvida ou reserva diferente para o mesmo pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /interno/reservas/{idPedido}:
    get:
      tags: [Interno]
      operationId: consultarReserva
      summary: Consulta a reserva de um pedido
      security:
        - serviceToken: []
      parameters:
        - in: path
          name: idPedido
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Reserva do pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservaEstoque" }
        "401":
          description: Token de serviço ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "404":
          description: Não há reserva para o pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /interno/reservas/{idPedido}/devolucao:
    post:
      tags: [Interno]
      operationId: devolverReserva
      summary: Devolve ao estoque a reserva de um pedido (idempotente)
      description: >-
        Chamada pelo Vendas quando o pedido é cancelado, expira ou é descartado.
        Repetir a chamada não devolve duas vezes.
      security:
        - serviceToken: []
      parameters:
        - in: path
          name: idPedido
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Reserva devolvida (ou já devolvida antes)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReservaEstoque" }
        "401":
          description: Token de serviço ausente ou inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "404":
          description: Não há reserva para o pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /categorias:
    get:
      tags: [Categorias]
      operationId: listarCategorias
      summary: Lista categorias ativas em ordem alfabética
      security: []
      parameters:
        - in: query
          name: incluirInativos
          schema: { type: boolean, default: false }
          description: >-
            "true" inclui itens inativos e exige token com "catalogo:gerenciar" (visão do painel).
      responses:
        "200":
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Categoria" }
    post:
      tags: [Categorias]
      operationId: criarCategoria
      summary: Cria categoria (permissão catalogo:gerenciar)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoriaEntrada" }
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Categoria" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /categorias/{id}:
    get:
      tags: [Categorias]
      operationId: buscarCategoria
      summary: Detalhe de categoria ativa
      description: Com token que tenha "catalogo:gerenciar" também mostra categoria inativa.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Categoria" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "404":
          description: Categoria não existe (ou está inativa e o token não tem permissão para vê-la)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    patch:
      tags: [Categorias]
      operationId: atualizarCategoria
      summary: Edita ou inativa (ativo=false) uma categoria (permissão catalogo:gerenciar)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoriaEntrada" }
      responses:
        "200":
          description: Categoria atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Categoria" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Categoria não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    delete:
      tags: [Categorias]
      operationId: excluirCategoria
      summary: Exclui categoria (só se nenhum produto a usar)
      description: >-
        Exige "catalogo:gerenciar". Exclusão física. Se houver produtos ligados responde 409; nesse caso
        mova os produtos ou inative (PATCH ativo=false).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Excluída
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Categoria não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "409":
          description: Há produtos ligados a ela
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /marcas:
    get:
      tags: [Marcas]
      operationId: listarMarcas
      summary: Lista marcas ativas em ordem alfabética
      security: []
      parameters:
        - in: query
          name: incluirInativos
          schema: { type: boolean, default: false }
          description: >-
            "true" inclui itens inativos e exige token com "catalogo:gerenciar" (visão do painel).
      responses:
        "200":
          description: Lista de marcas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Marca" }
    post:
      tags: [Marcas]
      operationId: criarMarca
      summary: Cria marca (permissão catalogo:gerenciar)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarcaEntrada" }
      responses:
        "201":
          description: Marca criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marca" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }

  /marcas/{id}:
    get:
      tags: [Marcas]
      operationId: buscarMarca
      summary: Detalhe de marca ativa
      description: Com token que tenha "catalogo:gerenciar" também mostra marca inativa.
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marca" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "404":
          description: Marca não existe (ou está inativa e o token não tem permissão para vê-la)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    patch:
      tags: [Marcas]
      operationId: atualizarMarca
      summary: Edita ou inativa (ativo=false) uma marca (permissão catalogo:gerenciar)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarcaEntrada" }
      responses:
        "200":
          description: Marca atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Marca" }
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Marca não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    delete:
      tags: [Marcas]
      operationId: excluirMarca
      summary: Exclui marca (só se nenhum produto a usar)
      description: >-
        Exige "catalogo:gerenciar". Exclusão física. Se houver produtos ligados responde 409; nesse caso
        mova os produtos ou inative (PATCH ativo=false).
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Excluída
        "400": { $ref: "#/components/responses/DadosInvalidos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/SemPermissao" }
        "404":
          description: Marca não existe
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "409":
          description: Há produtos ligados a ela
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }

  /health/live:
    get:
      tags: [Operação]
      operationId: healthLive
      summary: Liveness — o processo está vivo
      security: []
      responses:
        "200":
          description: Vivo

  /health:
    get:
      tags: [Operação]
      operationId: healthReady
      summary: Readiness — banco e Redis
      description: >-
        200 com status "ok" ou "degradado" (Redis fora: o catálogo funciona, só
        sem cache). 503 quando o banco está indisponível.
      security: []
      responses:
        "200":
          description: Pronto (ok ou degradado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /metrics:
    get:
      tags: [Operação]
      operationId: metricas
      summary: Métricas no formato Prometheus
      description: >-
        Responde 404 se METRICS_TOKEN não estiver configurado. Exige
        "Authorization: Bearer METRICS_TOKEN" (diferente do JWT de usuário).
      security:
        - metricsToken: []
      responses:
        "200":
          description: Métricas
          content:
            text/plain:
              schema: { type: string }
        "401":
          description: Token de métricas ausente ou inválido
        "404":
          description: Métricas desabilitadas

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: http
      scheme: bearer
      description: Valor de SERVICE_TOKEN (compartilhado entre serviços; não é um JWT)
    metricsToken:
      type: http
      scheme: bearer
      description: Valor de METRICS_TOKEN (não é um JWT)
  responses:
    DadosInvalidos:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    SemPermissao:
      description: Sem a permissão catalogo:gerenciar
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string }
        detalhes: { type: object }
    Produto:
      type: object
      properties:
        id_produto: { type: integer }
        nome: { type: string }
        descricao: { type: string, nullable: true }
        preco: { type: number, description: "Em reais, 2 casas decimais" }
        estoque: { type: integer }
        imagem: { type: string, nullable: true }
        destaque: { type: boolean }
        ativo: { type: boolean }
        peso: { type: number, nullable: true, description: kg }
        altura: { type: number, nullable: true, description: cm }
        largura: { type: number, nullable: true, description: cm }
        comprimento: { type: number, nullable: true, description: cm }
        id_marca: { type: integer }
        id_categoria: { type: integer }
        criado_em: { type: string, format: date-time }
        marca:
          type: object
          properties:
            id_marca: { type: integer }
            nome: { type: string }
        categoria:
          type: object
          properties:
            id_categoria: { type: integer }
            nome: { type: string }
    ProdutoEntrada:
      type: object
      required: [nome, preco, id_marca, id_categoria]
      properties:
        nome: { type: string, minLength: 1, maxLength: 255 }
        descricao: { type: string, maxLength: 5000, nullable: true }
        preco: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, description: No máximo 2 casas decimais }
        estoque: { type: integer, minimum: 0, default: 0 }
        imagem: { type: string, maxLength: 255, nullable: true }
        destaque: { type: boolean, default: false }
        ativo: { type: boolean, default: true }
        peso: { type: number, maximum: 999.999, nullable: true }
        altura: { type: number, maximum: 9999.99, nullable: true }
        largura: { type: number, maximum: 9999.99, nullable: true }
        comprimento: { type: number, maximum: 9999.99, nullable: true }
        id_marca: { type: integer, minimum: 1 }
        id_categoria: { type: integer, minimum: 1 }
    ProdutoAtualizacao:
      type: object
      minProperties: 1
      description: Qualquer subconjunto dos campos de ProdutoEntrada
      properties:
        nome: { type: string }
        descricao: { type: string, nullable: true }
        preco: { type: number }
        estoque: { type: integer, minimum: 0 }
        imagem: { type: string, nullable: true }
        destaque: { type: boolean }
        ativo: { type: boolean }
        peso: { type: number, nullable: true }
        altura: { type: number, nullable: true }
        largura: { type: number, nullable: true }
        comprimento: { type: number, nullable: true }
        id_marca: { type: integer }
        id_categoria: { type: integer }
    Categoria:
      type: object
      properties:
        id_categoria: { type: integer }
        nome: { type: string }
        icone: { type: string, nullable: true }
        ativo: { type: boolean }
    CategoriaEntrada:
      type: object
      properties:
        nome: { type: string, minLength: 1, maxLength: 255 }
        icone: { type: string, maxLength: 255, nullable: true }
        ativo: { type: boolean, default: true }
      description: No POST, "nome" é obrigatório. No PATCH, ao menos um campo.
    Marca:
      type: object
      properties:
        id_marca: { type: integer }
        nome: { type: string }
        ativo: { type: boolean }
    MarcaEntrada:
      type: object
      properties:
        nome: { type: string, minLength: 1, maxLength: 255 }
        ativo: { type: boolean, default: true }
      description: No POST, "nome" é obrigatório. No PATCH, ao menos um campo.
    ProdutoInterno:
      type: object
      properties:
        id_produto: { type: integer }
        nome: { type: string }
        preco: { type: number }
        estoque: { type: integer }
        ativo: { type: boolean }
        imagem: { type: string, nullable: true }
    ReservaEstoque:
      type: object
      properties:
        id_pedido: { type: integer }
        status: { type: string, enum: [ATIVA, DEVOLVIDA] }
        itens:
          type: array
          items:
            type: object
            properties:
              id_produto: { type: integer }
              quantidade: { type: integer }
              status: { type: string, enum: [ATIVA, DEVOLVIDA] }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degradado, indisponivel] }
        servico: { type: string }
        banco: { type: string, enum: [ok, falha] }
        redis: { type: string, enum: [ok, falha] }

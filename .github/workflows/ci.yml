name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Tipagem e testes de cada serviço. Os serviços com testes de integração usam o MySQL abaixo.
  servicos:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: catalogo_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        servico: [identidade-service, notificacao-service, catalogo-service, vendas-service, pagamento-service]
    defaults:
      run:
        working-directory: ${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.servico }}/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Configure integration database
        if: matrix.servico == 'catalogo-service' || matrix.servico == 'identidade-service'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_PASSWORD: root
          DB_NAME: ${{ matrix.servico == 'catalogo-service' && 'catalogo_db' || 'identidade_db' }}
        run: |
          node -e "const mysql = require('mysql2/promise'); mysql.createConnection({host: '127.0.0.1', user: 'root', password: 'root'}).then(async c => { await c.query('CREATE DATABASE IF NOT EXISTS ${{ matrix.servico == 'identidade-service' && 'identidade_db' || 'catalogo_db' }}'); await c.end(); })"
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          npx sequelize-cli db:migrate
      - name: Seed (cargos e permissões que os testes do Identidade exigem)
        if: matrix.servico == 'identidade-service'
        run: npx sequelize-cli db:seed:all
      - run: npx jest --runInBand

  # Os contratos precisam ser YAML válido e bater com as rotas do código (nenhuma rota sem documentação).
  contratos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python3 scripts/verificar-contratos.py

  # O gateway precisa ter configuração válida (e o /interno do Catálogo bloqueado).
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t
        run: docker run --rm -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t
      - name: /catalogo/interno/ bloqueado no nginx.conf
        run: grep -qF 'location ~ ^/catalogo/interno(/|$) {' infra/nginx/nginx.conf

  # Garante que a imagem de cada serviço compila no Linux (pega package-lock fora de sincronia com o `npm ci` do Docker).
  imagens:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [identidade-service, notificacao-service, catalogo-service, vendas-service, pagamento-service]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./${{ matrix.servico }}

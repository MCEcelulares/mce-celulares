# Nome fixo do projeto: a rede (mce-celulares_backend) e os volumes não dependem do nome da pasta.
name: mce-celulares

# Padrão: só o Nginx publica porta no host. Bancos e Redis são acessados por `docker exec` (veja o README).
# Única exceção, só em desenvolvimento (profile "dev"): a caixa de e-mails do Mailpit.
networks:
    backend:
        driver: bridge

volumes:
    identidade_db_data:
    catalogo_db_data:
    vendas_db_data:
    pagamento_db_data:
    notificacao_db_data:
    catalogo_uploads:

services:
    identidade_db:
        image: mysql:8.0
        container_name: identidade_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${IDENTIDADE_DB_NAME}
            MYSQL_ROOT_PASSWORD: ${IDENTIDADE_DB_PASSWORD}
        volumes:
          - identidade_db_data:/var/lib/mysql
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${IDENTIDADE_DB_PASSWORD}"]
          interval: 5s
          timeout: 5s
          retries: 10
          start_period: 20s
        networks:
          - backend

    catalogo_db:
        image: mysql:8.0
        container_name: catalogo_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${CATALOGO_DB_NAME}
            MYSQL_ROOT_PASSWORD: ${CATALOGO_DB_PASSWORD}
        volumes:
          - catalogo_db_data:/var/lib/mysql
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${CATALOGO_DB_PASSWORD}"]
          interval: 5s
          timeout: 5s
          retries: 10
          start_period: 20s
        networks:
          - backend

    vendas_db:
        image: mysql:8.0
        container_name: vendas_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${VENDAS_DB_NAME}
            MYSQL_ROOT_PASSWORD: ${VENDAS_DB_PASSWORD}
        volumes:
          - vendas_db_data:/var/lib/mysql
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${VENDAS_DB_PASSWORD}"]
          interval: 5s
          timeout: 5s
          retries: 10
          start_period: 20s
        networks:
          - backend

    pagamento_db:
        image: mysql:8.0
        container_name: pagamento_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${PAGAMENTO_DB_NAME}
            MYSQL_ROOT_PASSWORD: ${PAGAMENTO_DB_PASSWORD}
        volumes:
          - pagamento_db_data:/var/lib/mysql
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${PAGAMENTO_DB_PASSWORD}"]
          interval: 5s
          timeout: 5s
          retries: 10
          start_period: 20s
        networks:
          - backend

    notificacao_db:
        image: mysql:8.0
        container_name: notificacao_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${NOTIFICACAO_DB_NAME}
            MYSQL_ROOT_PASSWORD: ${NOTIFICACAO_DB_PASSWORD}
        volumes:
          - notificacao_db_data:/var/lib/mysql
        healthcheck:
          test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${NOTIFICACAO_DB_PASSWORD}"]
          interval: 5s
          timeout: 5s
          retries: 10
          start_period: 20s
        networks:
          - backend

    redis:
      image: redis:7-alpine
      container_name: redis
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 5s
        retries: 10
      networks:
        - backend

    identidade:
        build:
            context: ./identidade-service
        container_name: identidade
        restart: unless-stopped
        env_file: ./identidade-service/.env
        environment:
            DB_HOST: identidade_db
            DB_PORT: "3306"
            REDIS_URL: redis://redis:6379
            RUN_MIGRATIONS: "true"
            RUN_SEEDS: "true"
        depends_on:
            identidade_db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
          - backend

    catalogo:
        build:
            context: ./catalogo-service
        container_name: catalogo
        restart: unless-stopped
        env_file: ./catalogo-service/.env
        environment:
            DB_HOST: catalogo_db
            DB_PORT: "3306"
            REDIS_URL: redis://redis:6379
            RUN_MIGRATIONS: "true"
            UPLOADS_DIR: /app/uploads
        volumes:
            - catalogo_uploads:/app/uploads
        depends_on:
            catalogo_db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
          - backend

    vendas:
        build:
            context: ./vendas-service
        container_name: vendas
        restart: unless-stopped
        env_file: ./vendas-service/.env
        environment:
            DB_HOST: vendas_db
            DB_PORT: "3306"
            REDIS_URL: redis://redis:6379
            RUN_MIGRATIONS: "true"
        depends_on:
            vendas_db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
          - backend

    pagamento:
        build:
            context: ./pagamento-service
        container_name: pagamento
        restart: unless-stopped
        env_file: ./pagamento-service/.env
        environment:
            DB_HOST: pagamento_db
            DB_PORT: "3306"
            REDIS_URL: redis://redis:6379
            RUN_MIGRATIONS: "true"
        depends_on:
            pagamento_db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
          - backend

    notificacao:
        build:
            context: ./notificacao-service
        container_name: notificacao
        restart: unless-stopped
        env_file: ./notificacao-service/.env
        environment:
            DB_HOST: notificacao_db
            DB_PORT: "3306"
            REDIS_URL: redis://redis:6379
            RUN_MIGRATIONS: "true"
        depends_on:
            notificacao_db:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
          - backend

    nginx:
      image: nginx:alpine
      container_name: nginx
      restart: unless-stopped
      ports:
        - "8080:80"
      volumes:
        - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
        - ./infra/nginx/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
        - ./infra/swagger/index.html:/usr/share/nginx/docs/index.html:ro
        - ./apis:/usr/share/nginx/docs/apis:ro
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
        interval: 10s
        timeout: 3s
        retries: 5
        start_period: 5s
      networks:
        - backend

    # Caixa de e-mails de desenvolvimento (nenhum e-mail sai de verdade): docker compose --profile dev up -d
    # No notificacao-service/.env: SMTP_HOST=mailpit e SMTP_PORT=1025. Caixa de entrada: http://127.0.0.1:8025
    mailpit:
      image: axllent/mailpit
      container_name: mailpit
      profiles: ["dev"]
      restart: unless-stopped
      ports:
        - "127.0.0.1:8025:8025"
      networks:
        - backend
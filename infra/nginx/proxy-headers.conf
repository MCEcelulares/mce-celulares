# Parâmetros comuns de todos os `location` que repassam para um serviço (incluído em cada um por nginx.conf).
proxy_http_version 1.1;
proxy_set_header Connection "";

# Cabeçalhos para o serviço enxergar o cliente real (os serviços usam `trust proxy` = 1 e lêem o último X-Forwarded-For).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Serviço fora do ar falha rápido (502); leituras longas (ex.: upload de imagem) têm folga.
proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

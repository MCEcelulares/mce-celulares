events {
  worker_connections 1024;
}

http {
  # Não revela a versão do Nginx no cabeçalho Server.
  server_tokens off;

  # DNS interno do Docker — resolve os nomes dos serviços em tempo de requisição,
  # não na inicialização. Isso evita que o nginx caia quando um serviço
  # (identidade, catalogo, etc.) ainda não existe como container.
  resolver 127.0.0.11 valid=10s;
  resolver_timeout 2s;

  server {
    listen 80;

    location /identidade/ {
      set $upstream_identidade http://identidade:3001;
      rewrite ^/identidade/(.*)$ /$1 break;
      proxy_pass $upstream_identidade;
      include /etc/nginx/proxy-headers.conf;
    }

    # Rotas internas do Catálogo (reservas de estoque do Vendas): só dentro da rede dos contêineres (ADR-009/010).
    # Regex (vence o prefixo /catalogo/) para pegar também /catalogo/interno sem a barra final.
    # `~*` (sem diferenciar maiúsculas): o Express não diferencia, então /catalogo/Interno/... chegaria ao serviço.
    location ~* ^/catalogo/interno(/|$) {
      return 404;
    }

    location /catalogo/ {
      # Upload de imagem de produto (até 2 MB, RF15); o padrão do Nginx é 1 MB.
      client_max_body_size 3m;
      set $upstream_catalogo http://catalogo:3002;
      rewrite ^/catalogo/(.*)$ /$1 break;
      proxy_pass $upstream_catalogo;
      include /etc/nginx/proxy-headers.conf;
    }

    location /vendas/ {
      set $upstream_vendas http://vendas:3003;
      rewrite ^/vendas/(.*)$ /$1 break;
      proxy_pass $upstream_vendas;
      include /etc/nginx/proxy-headers.conf;
    }

    location /pagamento/ {
      set $upstream_pagamento http://pagamento:3004;
      rewrite ^/pagamento/(.*)$ /$1 break;
      proxy_pass $upstream_pagamento;
      include /etc/nginx/proxy-headers.conf;
    }

    location /notificacao/ {
      set $upstream_notificacao http://notificacao:3005;
      rewrite ^/notificacao/(.*)$ /$1 break;
      proxy_pass $upstream_notificacao;
      include /etc/nginx/proxy-headers.conf;
    }

    # Documentação da API (Swagger UI) servida a partir dos contratos em apis/.
    location /docs/ {
      alias /usr/share/nginx/docs/;
      index index.html;
    }

    location /health {
      return 200 "nginx ok\n";
      add_header Content-Type text/plain;
    }
  }
}

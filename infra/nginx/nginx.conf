events {
  worker_connections 1024;
}

http {
  # DNS interno do Docker — resolve os nomes dos serviços em tempo de requisição,
  # não na inicialização. Isso evita que o nginx caia quando um serviço
  # (identidade, catalogo, etc.) ainda não existe como container.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;

    location /identidade/ {
      set $upstream_identidade http://identidade:3001/;
      proxy_pass $upstream_identidade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /catalogo/ {
      set $upstream_catalogo http://catalogo:3002/;
      proxy_pass $upstream_catalogo;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /vendas/ {
      set $upstream_vendas http://vendas:3003/;
      proxy_pass $upstream_vendas;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /pagamento/ {
      set $upstream_pagamento http://pagamento:3004/;
      proxy_pass $upstream_pagamento;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /notificacao/ {
      set $upstream_notificacao http://notificacao:3005/;
      proxy_pass $upstream_notificacao;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
      return 200 "nginx ok\n";
      add_header Content-Type text/plain;
    }
  }
}